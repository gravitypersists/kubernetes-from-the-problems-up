<style>
  html, body { margin:0; height:100%; }

  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .deep { fill:var(--ink); }
  .hot { fill:var(--accent); }
  .tint { fill:var(--ink-4); }
  .blk { rx:var(--radius-1); }
  .mark { fill:none; stroke:var(--bg); stroke-width:var(--stroke); }
  .words { position:absolute; left:var(--sp-4); bottom:var(--sp-4); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.95; font-weight:800; font-stretch:112%; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--sp-2) 0 0 2px; font:400 13px/18px var(--font-mono); color:var(--ink-3); }
</style>
