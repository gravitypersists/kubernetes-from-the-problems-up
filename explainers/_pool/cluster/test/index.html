<!-- Builder test page for pool/cluster/ (not shipped: sync and build skip test/ folders).
     Open this file directly (file://) or serve explainers/_pool/. ?theme=dark forces the dark theme.
     One snapshot per optional feature, each drawn at a desktop canvas width (560px) and a phone width
     (360px); the data below is a sample in Ch 05's units (GB, cores), not chapter content. The last
     group (pool-02) draws the narrow-width fallbacks, at the plate width of a 360px phone's inline
     snapshot (314px) where that is where they apply. Then pool-03 (Ch 06) and pool-04 (Ch 07: the Service
     block and narrow chips that keep their service name). -->
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../cluster.css">
<style>
  body { margin: 0; padding: var(--sp-3) var(--sp-2) var(--sp-8); background: var(--bg); color: var(--ink); font: 400 var(--fs-small)/var(--lh-small) var(--font-sans); }
  h1 { font: 700 var(--fs-h3)/var(--lh-h3) var(--font-sans); margin: 0 0 var(--sp-1); }
  h2 { font: 700 var(--fs-body)/var(--lh-body) var(--font-sans); margin: var(--sp-5) 0 var(--sp-half); }
  p, li { max-width: 80ch; margin: 0 0 var(--sp-1); }
  code { font: 400 var(--fs-caption)/var(--lh-caption) var(--font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: flex-start; }
  .fig { flex: none; max-width: 100%; }
  .fig > p { font: 700 var(--fs-caption)/var(--lh-caption) var(--font-mono); color: var(--ink-3); margin: 0 0 var(--sp-half); text-transform: uppercase; letter-spacing: .06em; }
</style>

<body>
<h1>pool/cluster: optional features</h1>
<p>Each section draws one snapshot that uses one optional field (named in the heading) at 560px and 360px. Without these fields the drawing is Ch 04's, unchanged. Format: <code>explainers/_pool/README.md</code>, "Cluster drawing". Outlined parts carry the step highlight.</p>
<div id="cases"></div>

<script src="../cluster.js"></script>
<script>
(function () {
  if (/theme=dark/.test(location.search)) document.documentElement.setAttribute('data-theme', 'dark');
  if (/theme=light/.test(location.search)) document.documentElement.setAttribute('data-theme', 'light');

  /* ---- a sample chapter data object in Ch 05's units ---- */
  var DATA = {
    NODES: ['01', '02', '04'],
    CAPACITY: { memory: 13, cpu: 3.9 },   /* room for Pods per node */
    UNIT: 'GB',
    ROOM_UNIT: 2,                          /* one drawn unit of room (Ch 04's) = 2 GB */
    SERVICES: {
      storefront:    { size: 4, cpu: 0.5,  label: 'storefront',    breaks: ['store-', 'front'] },
      orders:        { size: 6, cpu: 1,    label: 'orders',        breaks: ['orders'] },
      payments:      { size: 2, cpu: 0.25, label: 'payments',      breaks: ['pay-', 'ments'] },
      dispatch:      { size: 2, cpu: 1,    label: 'dispatch',      breaks: ['dis-', 'patch'] },
      notifications: { size: 2, cpu: 0.25, label: 'notifications', breaks: ['notifi-', 'cations'] }
    },
    LOOPS: { rs: { label: 'ReplicaSet loop' }, sched: { label: 'scheduler' } },
    PODS: {
      pa1: { service: 'payments' }, sf1: { service: 'storefront' }, di1: { service: 'dispatch' }, no1: { service: 'notifications' },
      di2: { service: 'dispatch' }, di3: { service: 'dispatch' }, sf2: { service: 'storefront' }, no2: { service: 'notifications' },
      pa2: { service: 'payments' }, sf3: { service: 'storefront' }, or1: { service: 'orders' },
      di5: { service: 'dispatch' }, di6: { service: 'dispatch' }, di7: { service: 'dispatch' }
    },
    STRINGS: {
      widget: 'W-01 · The cluster', widgetShort: 'W-01', step: 'Step', node: 'Node', free: 'free', down: 'DOWN',
      status: { running: 'RUNNING', notstarted: 'NOT STARTED', starting: 'STARTING', lost: 'LOST', crashed: 'CRASHED', waiting: 'WAITING' },
      statusBreaks: { notstarted: ['NOT', 'STARTED'] },
      nodeStatus: { unknown: 'UNKNOWN' },
      record: { title: 'The cluster’s record · API server', titleShort: 'The record · API server', want: 'WANT', running: 'RUNNING', short: 'SHORT', unknown: 'UNKNOWN', waiting: 'WAITING' },
      loopMark: '↻', agent: 'agent', agents: 'agents',
      lens: { watching: 'Sees', doing: 'Does' },
      /* the optional features' strings */
      cpu: 'CPU',
      waiting: 'Waiting · no room',
      verdict: { fits: 'Fits', mem: 'No memory', cpu: 'No processor', cores: 'cores', free: 'free',
                 short: { fits: '✓ Fits', mem: '✕ Mem', cpu: '✕ CPU' } },
      scheduler: 'Scheduler',
      newNode: 'New',
      spare: 'Spare',
      use: { over: 'Uses more than it reserves', overBreaks: ['Uses more', 'than it', 'reserves'], overShort: 'Over' }
    }
  };
  var ROWS = ['orders', 'payments', 'dispatch', 'storefront', 'notifications'];
  var WANT = { orders: 1, payments: 2, dispatch: 6, storefront: 3, notifications: 2 };
  var PODS6 = { orders: ['or1'], payments: ['pa1', 'pa2'], dispatch: ['di1', 'di2', 'di3', 'di5', 'di6', 'di7'], storefront: ['sf1', 'sf2', 'sf3'], notifications: ['no1', 'no2'] };
  var START = { '01': ['pa1', 'sf1', 'di1', 'no1'], '02': ['di2', 'di3', 'sf2', 'no2'], '04': ['pa2', 'sf3', 'or1'] };
  var SHOWN = ['rs', 'sched'];

  /* a five-step lane in the shape of Ch 05's plan, so lane-wide choices (five columns reserved from
     the first step, bar and footer forms) apply as they will in the chapter */
  var F1 = { nodes: START, record: { rows: ROWS, want: WANT, pods: { orders: ['or1'], payments: ['pa1', 'pa2'], dispatch: ['di1', 'di2', 'di3', 'di5', 'di6', 'di7'], storefront: ['sf1', 'sf2', 'sf3'], notifications: ['no1', 'no2'] } },
    loops: { shown: SHOWN, active: ['rs'], agents: [], lens: { watching: 'dispatch: 6 wanted, 3 Pods', doing: 'writes 3 new Pod records' } }, notes: [], clock: '17:45' };
  var F2 = { nodes: { '01': ['pa1', 'sf1', 'di1', 'no1', 'di5:notstarted'], '02': ['di2', 'di3', 'sf2', 'no2', 'di6:notstarted'], '04': ['pa2', 'sf3', 'or1'] },
    record: { rows: ROWS, want: WANT, pods: PODS6 },
    verdicts: { '01': { verdict: 'mem cpu', memory: 1, cpu: 0.9 }, '02': { verdict: 'fits', memory: 3, cpu: 1.15 }, '04': 'mem' },
    loops: { shown: SHOWN, active: ['sched'], agents: [], lens: { watching: '3 Pods with no node', doing: 'places 2: dispatch → 01, dispatch → 02' } }, notes: [], clock: 'Seconds later' };
  var F3NODES = { '01': ['pa1', 'sf1', 'di1', 'no1', 'di5'], '02': ['di2', 'di3', 'sf2', 'no2', 'di6'], '04': ['pa2', 'sf3', 'or1'] };
  var REASON = { id: 'reason', type: 'scheduler', text: '0/3 nodes are available: 2 Insufficient cpu, 3 Insufficient memory.' };
  var F3 = { nodes: F3NODES, waiting: ['di7'], record: { rows: ROWS, want: WANT, pods: PODS6 },
    verdicts: { '01': 'mem cpu', '02': 'mem cpu', '04': 'mem' },
    loops: { shown: SHOWN, active: ['sched'], agents: [], lens: { watching: '1 Pod with no node; no node with room', doing: 'leaves it unplaced; records why' } },
    notes: [REASON], clock: 'Seconds later' };
  var F4 = { nodes: F3NODES, waiting: ['di7'], record: { rows: ROWS, want: WANT, pods: PODS6 },
    loops: { shown: SHOWN, active: ['sched'], agents: [], lens: { watching: '1 Pod with no node', doing: 'tries again whenever the cluster changes' } },
    notes: [REASON, { id: 'dispatch', label: 'Dispatch', text: '5 of 6 copies running at the rush', tone: 'warn' }], clock: '18:00–18:40' };
  var F5 = { nodes: { '01': F3NODES['01'], '02': F3NODES['02'], '04': F3NODES['04'], '05': ['di7:notstarted'], '06': [] },
    newNodes: ['05', '06'], verdicts: { '05': 'fits', '06': 'fits' }, record: { rows: ROWS, want: WANT, pods: PODS6 },
    loops: { shown: SHOWN, active: ['sched'], agents: [], lens: { watching: '1 Pod with no node; two new nodes', doing: 'dispatch → 05' } },
    notes: [], clock: '~18:40' };
  var LANE = [F1, F2, F3, F4, F5];

  /* the sandbox: nodes only, use fills, fractional requests, a spare node, rows of four */
  var SAND = JSON.parse(JSON.stringify(DATA));
  SAND.NODES = [];
  SAND.PODS.or1.size = 4.5;                              /* orders request 4.5 GB, used 5.5 */
  ['di1', 'di2', 'di3', 'di5', 'di6', 'di7'].forEach(function (id) { SAND.PODS[id].size = 0.5; });   /* used 1 */
  var SANDSTATE = {
    nodes: { '1': ['sf1:placed', 'or1:placed', 'pa1:placed', 'no1:placed'], '2': ['sf2:placed', 'sf3:placed', 'di1:placed', 'di2:placed'],
             '3': ['di3:placed', 'di5:placed', 'di6:placed', 'pa2:placed', 'no2:placed'], '4': ['di7:placed'], '5': [] },
    spare: ['5'],
    use: { sf1: 2, sf2: 2, sf3: 2, or1: 5.5, pa1: 0.5, pa2: 0.5, no1: 0.5, no2: 0.5, di1: 1, di2: 1, di3: 1, di5: 1, di6: 1, di7: 1 }
  };

  var LANE_R = ClusterCanvas.create(DATA);
  var SAND_R = ClusterCanvas.create(SAND);

  var CASES = [
    { title: '1 · Capacity and unit: CAPACITY { memory, cpu }, UNIT, ROOM_UNIT; fractional sizes',
      note: 'Chip height = memory request (ROOM_UNIT 2: one Ch 04 unit = 2 GB); free room reads “N GB FREE”. Lane step F1; five columns reserved because a later step has five nodes.',
      lane: 1, state: F1, highlight: ['row:dispatch', 'loop:rs', 'lens', 'free:01'] },
    { title: '2 · Processor footer (computed from SERVICES[s].cpu; any CAPACITY.cpu)',
      note: 'CPU reserved / room for Pods on each node, ink-2; highlight key cpu:&lt;node&gt;.',
      lane: 1, state: F1, highlight: ['cpu:01', 'cpu:02', 'cpu:04'] },
    { title: '3 · waiting: [podIds] — the WAITING strip and the “n WAITING” row word',
      note: 'Highlight keys waiting (the strip) and p:&lt;pod&gt;. Lane step F4.',
      lane: 1, state: F4, highlight: ['waiting', 'row:dispatch', 'note:dispatch'] },
    { title: '4 · verdicts: { node: "fits" | "mem" | "cpu" | "mem cpu" | { verdict, memory, cpu } }',
      note: 'Wide form with free amounts (computed, or given at the moment of the check); narrow form at 360px. Lane step F2 (02’s free amounts given in the object form).',
      lane: 1, state: F2, highlight: ['verdict:01', 'verdict:02', 'verdict:04', 'p:di5', 'p:di6'] },
    { title: '4b · verdicts, NO MEMORY · NO PROCESSOR (lane step F3)',
      lane: 1, state: F3, highlight: ['verdict:01', 'verdict:02', 'verdict:04', 'p:di7', 'note:reason'] },
    { title: '5 · notes: [{ type: "scheduler", text }] — the recorded reason',
      note: 'Labelled SCHEDULER (STRINGS.scheduler, or the note’s own label); wraps.',
      lane: 1, state: F3, highlight: ['note:reason'] },
    { title: '6 · newNodes: [ids] — the NEW tag (lane step F5)',
      note: 'Highlight key new:&lt;node&gt;; the tag sits on the id line, the pill row or its own line, whichever fits.',
      lane: 1, state: F5, highlight: ['new:05', 'new:06', 'n:05', 'n:06', 'p:di7', 'verdict:05', 'verdict:06'] },
    { title: '7 · use: { podId: amount } — use fill, and the overflow form (hatched, warn)',
      note: 'Status “placed”: a Pod in a what-if packing, no status word. orders requests 4.5 GB and used 5.5; dispatch requests 0.5 and used 1 (on node 3, top Pod: the overflow is clipped at the node’s top, dashed edge). Highlight key use:&lt;pod&gt;.',
      sand: 1, state: SANDSTATE, highlight: ['use:or1'] },
    { title: '8 · opts.nodesOnly (no record, no loop pills, no step counter); opts.columns: 4; spare: [ids]',
      note: 'The sandbox drawing. Header given with no n: title only. spare draws a dashed c6 frame with SPARE in its body.',
      sand: 1, state: SANDSTATE, header: { lane: '', n: null }, highlight: [] },
    { title: '8b · opts.labels: false (chips show only outline and fill)',
      sand: 1, state: SANDSTATE, labels: false, highlight: [] },

    /* ---- pool-02: narrow-width fallbacks. "360" = the plate of an inline snapshot on a 360px phone
       (314px: the step card's width plus its bleed), as lanes.js draws it; nothing here is a new field */
    { group: 'pool-02 · narrow-width fallbacks (each applies only where the drawing doesn’t fit; Ch 04 is unchanged)' },
    { title: 'P1 · node ids: NODE 01 → bare 01 when “NODE 01” misses any node’s bar (lane-wide)',
      note: 'Lane step F5 in five columns on a 360px phone (314px plate): all five bars read 01 … 06 rather than a clipped “NODE 0”. At 560px: NODE · 01.',
      lane: 1, state: F5, widths: [560, 314], highlight: ['new:05', 'new:06'] },
    { title: 'P2 · record row word: smaller marks, then the word on its own line',
      note: 'Lane step F3. 314px: the compact word (1 WAITING) would overlap six 10px marks, so the marks draw at 8px, 2px apart. 250px: still too narrow, so each row’s word takes a line under its row (here in full: 5 RUNNING · 1 WAITING).',
      lane: 1, state: F3, widths: [314, 250], highlight: ['row:dispatch'] },
    { title: 'P3 · per-state columns in inline snapshots (lanes.js)',
      note: 'Lane step F3 at 314px. Left: the lane-wide reservation (five columns, as the sticky canvas draws it). Right: the inline snapshot, sized to its own state’s three nodes; F5’s snapshot keeps five. Default for lanes whose node count varies; lane option snapColumns: \'lane\' turns it off.',
      lane: 1, state: F3, widths: [314, 314], perState: [false, true], highlight: ['waiting', 'p:di7'] },
    { title: 'P5 · very short chips: no label below one line’s glyphs',
      note: 'Sandbox requests: dispatch 0.5 GB, payments 1 GB, notifications 1.5 GB (unit 22 at 360, 28 at 560). A chip whose text room is under 10px draws outline and fill only (0 lines) instead of a clipped 13px line; from 10px it holds one tight line, as before.',
      sand: 2, state: null, widths: [560, 360], highlight: [] },
    { title: 'P6 · free room shorter than a line: the amount alone, or no label',
      note: 'Same drawing. A free box shorter than 16px shows only the amount (“1.5 GB”) where its inside holds the glyphs (≥ 10px), and no label below that (1 GB at unit 22–28 is 9.5–12px), instead of “1 GB FREE” over its dashed edges.',
      sand: 2, state: null, widths: [560, 360], highlight: ['free:1', 'free:2', 'free:3'] }
  ];

  /* P5/P6: short Pods and short free boxes */
  var SHORT = JSON.parse(JSON.stringify(DATA));
  SHORT.NODES = [];
  ['di1', 'di2', 'di3', 'di5', 'di6', 'di7'].forEach(function (id) { SHORT.PODS[id].size = 0.5; });
  ['pa1', 'pa2'].forEach(function (id) { SHORT.PODS[id].size = 1; });
  ['no1', 'no2'].forEach(function (id) { SHORT.PODS[id].size = 1.5; });
  SHORT.PODS.or1.size = 4.5;
  SHORT.SERVICES.dispatch.cpu = 0.25;   /* keeps each node's processor within its room */
  var SHORTSTATE = {
    nodes: { '1': ['or1:placed', 'sf1:placed', 'pa1:placed', 'no1:placed', 'di1:placed', 'di2:placed'],   /* 12 GB: 1 GB free */
             '2': ['sf2:placed', 'sf3:placed', 'pa2:placed', 'no2:placed', 'di3:placed', 'di5:placed'],   /* 11.5 GB: 1.5 GB free */
             '3': ['di6:placed', 'di7:placed'], '4': [] },
    spare: ['4']
  };
  var SHORT_R = ClusterCanvas.create(SHORT);

  /* ---- pool-03 (Ch 06): a Deployment group in the record, status notready, per-Pod series colour, and
     STATUS_INLINE. A sample in Ch 06's shape: catalog moving from v62 (series 5) to v63 (series 2) on two
     nodes; one dispatch Pod in the default colour. ---- */
  var ROLL = {
    NODES: ['05', '06'], CAPACITY: { memory: 13, cpu: 3.9 }, UNIT: 'GB', ROOM_UNIT: 2, STATUS_INLINE: true,
    SERVICES: {
      catalog:  { size: 2, cpu: 0.25, label: 'catalog',  breaks: ['catalog'] },
      dispatch: { size: 2, cpu: 1,    label: 'dispatch', breaks: ['dispatch'] }
    },
    LOOPS: { deploy: { label: 'Deployment loop' }, rs: { label: 'ReplicaSet loop' }, sched: { label: 'scheduler' } },
    PODS: {
      di7: { service: 'dispatch' },
      c1: { service: 'catalog', version: 'v62', series: 5 }, c2: { service: 'catalog', version: 'v62', series: 5 },
      c3: { service: 'catalog', version: 'v62', series: 5 },
      n1: { service: 'catalog', version: 'v63', series: 2 }, n2: { service: 'catalog', version: 'v63', series: 2 },
      n3: { service: 'catalog', version: 'v63', series: 2 },
      x1: { service: 'catalog', version: 'v64', series: 5 }
    },
    STRINGS: JSON.parse(JSON.stringify(DATA.STRINGS))
  };
  ROLL.STRINGS.status.running = 'READY';
  ROLL.STRINGS.status.notready = 'NOT READY';
  ROLL.STRINGS.status.stopped = 'STOPPED';
  ROLL.STRINGS.statusBreaks.notready = ['NOT', 'READY'];
  ROLL.STRINGS.record.running = 'READY';
  ROLL.STRINGS.record.deployment = 'Deployment';
  ROLL.STRINGS.record.replicaSet = 'ReplicaSet';
  ROLL.STRINGS.record.kept = 'KEPT';
  var DEP = { name: 'catalog', want: 3, version: 'v63', rows: ['v62', 'v63'] };
  var RSHOWN = ['deploy', 'rs', 'sched'];
  var CUST = function (t, tone) { return { id: 'customers', label: 'Customers', text: t, tone: tone || 'good' }; };
  var R1 = { nodes: { '05': ['di7', 'c1'], '06': ['c2', 'c3'] },
    record: { deployment: DEP, rows: ['v62', 'v63'], want: { v62: 3, v63: 1 }, pods: { v62: ['c1', 'c2', 'c3'], v63: [] } },
    loops: { shown: RSHOWN, active: ['deploy'], agents: [], lens: { watching: 'record wants v63; 3 Pods run v62', doing: 'makes a v63 ReplicaSet, wanting 1' } },
    notes: [CUST('served by v62 ×3')], clock: '10:15:00' };
  var R2 = { nodes: { '05': ['di7', 'c1', 'n1:notready'], '06': ['c2', 'c3'] },
    record: { deployment: DEP, rows: ['v62', 'v63'], want: { v62: 3, v63: 1 }, pods: { v62: ['c1', 'c2', 'c3'], v63: ['n1'] } },
    loops: { shown: RSHOWN, active: ['deploy'], agents: ['05'], lens: { watching: '4 Pods; the v63 Pod not ready', doing: 'waits' } },
    notes: [CUST('served by v62 ×3')], clock: 'Seconds later' };
  var R3 = { nodes: { '05': ['di7', 'c1', 'n1'], '06': ['c2:stopped', 'c3'] },
    record: { deployment: DEP, rows: ['v62', 'v63'], want: { v62: 2, v63: 1 }, pods: { v62: ['c1', 'c3'], v63: ['n1'] }, deleting: { v62: ['c2'] } },
    loops: { shown: RSHOWN, active: ['deploy'], agents: [], lens: { watching: '1 v63 Pod ready', doing: 'v62 down to 2' } },
    notes: [CUST('served by v62 ×2 · v63 ×1')], clock: '~10:15:20' };
  var R5 = { nodes: { '05': ['di7', 'n1', 'n3'], '06': ['n2'] },
    record: { deployment: DEP, rows: ['v62', 'v63'], want: { v62: 0, v63: 3 }, pods: { v62: [], v63: ['n1', 'n2', 'n3'] } },
    loops: { shown: RSHOWN, active: ['deploy'], agents: [], lens: { watching: '3 v63 Pods ready, as wanted', doing: 'nothing more; keeps the v62 ReplicaSet, empty' } },
    notes: [CUST('served by v63 ×3')], clock: '~10:16' };
  var RLANE = [R1, R2, R3, R5];
  var CRASH = { nodes: { '05': ['di7', 'n1', 'n3'], '06': ['n2', 'x1:crashed'] }, restarts: { x1: 3 },
    record: { deployment: { name: 'catalog', want: 3, version: 'v64', rows: ['v63', 'v64'] }, rows: ['v63', 'v64'], want: { v63: 3, v64: 1 }, pods: { v63: ['n1', 'n2', 'n3'], v64: ['x1'] } },
    loops: { shown: RSHOWN, active: ['deploy'], agents: [], lens: { watching: 'v64 Pod not ready', doing: 'waits; removes no v63 Pod' } },
    notes: [CUST('served by v63 ×3 · prices correct')] };
  /* a record that mixes an ungrouped row with a group: the columns stay aligned */
  var MIXED = { nodes: R2.nodes,
    record: { deployment: DEP, rows: ['dispatch', 'v62', 'v63'], want: { dispatch: 6, v62: 3, v63: 1 }, pods: { dispatch: ['di7'], v62: ['c1', 'c2', 'c3'], v63: ['n1'] } },
    loops: R2.loops, notes: [] };
  /* every series colour, and the series on statuses that keep their own look */
  var SER = JSON.parse(JSON.stringify(ROLL));
  SER.NODES = [];
  ['s1', 's2', 's3', 's4', 's5', 's6'].forEach(function (id, i) { SER.PODS[id] = { service: 'catalog', version: 'c' + (i + 1), series: i + 1 }; });
  SER.PODS.w5 = { service: 'catalog', version: 'v64', series: 5 };
  var SERSTATE = { nodes: { 'a': ['s1', 's2', 's3', 's4', 's5', 's6'], 'b': ['x1:crashed', 'c1:notready', 'c2:stopped', 'n1:notstarted', 'n2:starting', 'di7'] },
    waiting: ['w5'], restarts: { x1: 3 },
    record: { rows: [], want: {}, pods: {} }, loops: { shown: [], active: [], agents: [] } };
  /* the same data with STATUS_INLINE off: a one-line chip drops READY (as in Ch 04–05) */
  var ROLL_OFF = JSON.parse(JSON.stringify(ROLL)); delete ROLL_OFF.STATUS_INLINE;
  var ROLL_R = ClusterCanvas.create(ROLL), SER_R = ClusterCanvas.create(SER), ROLL_OFF_R = ClusterCanvas.create(ROLL_OFF);
  CASES.push(
    { group: 'pool-03 · Ch 06 optional fields (each off when absent; Ch 04 and Ch 05 are unchanged)' },
    { title: 'D1 · record.deployment: { name, want, version, rows } — a Deployment row over indented ReplicaSet rows',
      note: 'Lane step R1. Header DEPLOYMENT · catalog · WANT 3 · v63 (STRINGS.record.deployment); rows named STRINGS.record.replicaSet + key where every row fits with its full word, else the key alone (lane-wide; 314px). Highlight keys dep:&lt;name&gt; and dep:&lt;name&gt;:version (here the version).',
      roll: R1, rlane: RLANE, widths: [560, 360, 314], highlight: ['dep:catalog:version', 'row:v63'] },
    { title: 'D2 · KEPT: a grouped row with WANT 0 and no Pods (STRINGS.record.kept, ink-3)',
      note: 'Lane step R5. The emptied v62 ReplicaSet stays in the record. Whole header highlighted (dep:catalog).',
      roll: R5, rlane: RLANE, widths: [560, 360, 314], highlight: ['dep:catalog', 'row:v62'] },
    { title: 'D3 · a group beside an ungrouped row: columns stay aligned (the indent is inside the name column)',
      roll: MIXED, rlane: [MIXED], widths: [560, 314], highlight: [] },
    { title: 'N1 · status notready: solid chip, hollow lamp, NOT READY (warn), hollow record mark',
      note: 'Lane step R2 (STATUS_INLINE on, so each one-line chip carries its word: “catalog v63 □ NOT READY”, or “v63 □ NOT READY” where the label doesn’t fit with it). STOPPED and the struck mark: step R3 below.',
      roll: R2, rlane: RLANE, widths: [560, 360, 314], highlight: ['p:n1', 'row:v63'] },
    { title: 'N2 · STOPPED and a record marked for deletion (lane step R3)',
      roll: R3, rlane: RLANE, widths: [560, 314], highlight: ['p:n1', 'p:c2', 'row:v62'] },
    { title: 'S1 · PODS[id].series 1–6: chip in cN on cN-soft, ring in ink; c5 beside a bad status word',
      note: 'Left column: series 1–6. Right: series 5 CRASHED ↻ 3 (bad), NOT READY, STOPPED / NOT STARTED (keep their own looks), STARTING, and dispatch with no series (c1). Strip: a WAITING Pod in series 5 (dashed c5 edge).',
      ser: 1, state: SERSTATE, widths: [560, 360], highlight: [] },
    { title: 'S2 · Fig. 03’s crash panel: v64 (series 5) CRASHED ↻ 3 beside v63 (series 2)',
      roll: CRASH, rlane: [CRASH], widths: [440, 328], highlight: ['p:x1', 'note:customers'] },
    { title: 'I1 · STATUS_INLINE off (absent): the same R2, as Ch 04–05 draw one-line chips',
      note: 'Without the flag a RUNNING (READY) chip with no line of its own stays unmarked and an abnormal one keeps only its word.',
      rolloff: 1, roll: R2, rlane: RLANE, widths: [560, 314], highlight: [] }
  );

  /* ---- pool-04 (Ch 07): the Service block (record.service, PODS[id].addr) and narrow chips that keep
     their service name. The same rollout sample, now with Pod addresses and a catalog Service; the
     record holds only the Service (rows: []), as in Ch 07's lane S. ---- */
  var SVCD = JSON.parse(JSON.stringify(ROLL));
  SVCD.NODES = [];
  var ADDR = { c1: '10.4.5.12', c2: '10.4.6.8', c3: '10.4.6.9', n1: '10.4.5.14', n2: '10.4.6.11', n3: '10.4.5.15' };
  Object.keys(ADDR).forEach(function (id) { SVCD.PODS[id].addr = ADDR[id]; });
  SVCD.SERVICES.orders = { size: 6, cpu: 1, label: 'orders', breaks: ['orders'] };
  SVCD.SERVICES.notifications = { size: 2, cpu: 0.25, label: 'notifications', breaks: ['notifi-', 'cations'] };
  SVCD.PODS.or1 = { service: 'orders', addr: '10.4.4.7' };
  SVCD.PODS.no1 = { service: 'notifications', addr: '10.4.1.21' };
  SVCD.PODS.no2 = { service: 'notifications', addr: '10.4.2.30' };
  SVCD.LOOPS.ep = { label: 'endpoints loop' };
  SVCD.STRINGS.status.crashed = 'OOM-KILLED';
  SVCD.STRINGS.statusBreaks.crashed = ['OOM-', 'KILLED'];
  SVCD.STRINGS.record.service = 'Service';
  SVCD.STRINGS.record.list = 'Ready Pods';
  SVCD.STRINGS.record.none = 'None';
  var SVC_R = ClusterCanvas.create(SVCD);
  var CAT = function (list, leaving) { var s = { name: 'catalog', addr: '10.96.0.21', list: list }; if (leaving) s.leaving = leaving; return s; };
  var EPL = function (w, d) { return { shown: ['deploy', 'ep'], active: ['ep'], agents: [], lens: { watching: w, doing: d } }; };
  var CALLS = function (t, tone) { return { id: 'calls', label: 'storefront → catalog', text: t, tone: tone || 'good' }; };
  var V1 = { nodes: { '05': ['di7', 'c1'], '06': ['c2', 'c3'] }, record: { rows: [], want: {}, pods: {}, service: CAT(['c1', 'c2', 'c3']) },
    loops: EPL('3 Pods match, all ready', 'lists all 3'), notes: [CALLS('answered by v62 ×3')], clock: '10:15:00' };
  var V2 = { nodes: { '05': ['di7', 'c1', 'n1:notready'], '06': ['c2', 'c3'] }, record: { rows: [], want: {}, pods: {}, service: CAT(['c1', 'c2', 'c3']) },
    loops: EPL('a 4th matching Pod, not ready', 'leaves it off the list'), notes: [CALLS('answered by v62 ×3')], clock: 'Seconds later' };
  var V3 = { nodes: { '05': ['di7', 'c1', 'n1'], '06': ['c2:stopped', 'c3'] }, record: { rows: [], want: {}, pods: {}, service: CAT(['c1', 'c3', 'n1'], ['c2']) },
    loops: EPL('v63 Pod ready; a v62 Pod stopping', 'adds one, removes one'), notes: [CALLS('answered by v62 ×2 · v63 ×1')], clock: '~10:15:20' };
  var V4 = { nodes: { '05': ['di7', 'n1', 'n3'], '06': ['c3:stopped', 'n2'] }, record: { rows: [], want: {}, pods: {}, service: CAT(['n1', 'n2', 'n3'], ['c3']) },
    loops: EPL('3 Pods match, all ready', 'lists all 3'), notes: [CALLS('answered by v63 ×3')], clock: '~10:16' };
  var VLANE = [V1, V2, V3, V4];
  var ORD = function (list) { return { name: 'orders', addr: '10.96.0.25', list: list }; };
  var E1 = { nodes: { '04': ['or1:crashed'] }, restarts: { or1: 1 }, record: { rows: [], want: {}, pods: {}, service: ORD([]) },
    loops: { shown: ['ep'], active: ['ep'], agents: [], lens: { watching: 'orders’ only Pod not ready', doing: 'empties the list' } },
    notes: [{ id: 'calls', label: 'storefront → orders', text: 'connection refused', tone: 'bad' }] };
  var E2 = { nodes: { '04': ['or1'] }, restarts: { or1: 1 }, record: { rows: [], want: {}, pods: {}, service: ORD(['or1']) },
    loops: { shown: ['ep'], active: ['ep'], agents: [], lens: { watching: 'the Pod ready again', doing: 'lists it, same address' } },
    notes: [{ id: 'calls', label: 'storefront → orders', text: 'answered', tone: 'good' }] };
  /* below a Deployment group: the block's top rule separates it from the rows */
  var VDEP = { nodes: V3.nodes,
    record: { deployment: DEP, rows: ['v62', 'v63'], want: { v62: 2, v63: 1 }, pods: { v62: ['c1', 'c3'], v63: ['n1'] }, deleting: { v62: ['c2'] }, service: CAT(['c1', 'c3', 'n1'], ['c2']) },
    loops: EPL('v63 Pod ready; a v62 Pod stopping', 'adds one, removes one'), notes: [] };
  /* a long name and address: the header wraps at a phone's width (svcWrap) */
  var VLONG = { nodes: { '01': ['no1'], '02': ['no2'] }, record: { rows: [], want: {}, pods: {},
    service: { name: 'notifications', addr: '10.96.100.214', list: ['no1', 'no2'] } }, loops: { shown: ['ep'], active: ['ep'], agents: [] }, notes: [] };
  CASES.push(
    { group: 'pool-04 · Ch 07: the Service block and narrow chips (each off when absent; Ch 04–06 unchanged except narrow STATUS_INLINE chips)' },
    { title: 'V1 · record.service: { name, addr, list } — header SERVICE · catalog · 10.96.0.21 over the READY PODS list',
      note: 'Lane step S1 (rows: [], so the Service is the record’s only block). Entries: a square in the Pod’s series colour, its version, PODS[id].addr. Wide: the label beside the entries, separator dots between entries on a line. Narrow (&lt; 440px): the label on its own line, entries two to a line, no dots. Highlight keys svc:&lt;name&gt; (header) and svc:&lt;name&gt;:list.',
      svc: V1, slane: VLANE, widths: [560, 360, 314], highlight: ['svc:catalog', 'svc:catalog:list'] },
    { title: 'V2 · leaving: [podIds] — struck through in ink-3, after the listed entries, not counted',
      note: 'Lane step S3: one added (v63), one leaving (v62, its Pod STOPPED). The list reserves its fullest state’s line count lane-wide, so every step of the lane has the same height. Highlight key svc:&lt;name&gt;:&lt;podId&gt; (one entry).',
      svc: V3, slane: VLANE, widths: [560, 360, 314], highlight: ['svc:catalog:n1', 'svc:catalog:c2', 'p:n1', 'p:c2'] },
    { title: 'V3 · an empty list: NONE (STRINGS.record.none, bad)',
      note: 'Ch 07’s Fig. 04 left panel: orders’ only Pod OOM-killed and restarting, so nothing is listed; right: the same Pod back on the list. No header bar; the two panels share one layout and reserve.',
      svc: E1, slane: [E1, E2], noHeader: true, widths: [440, 314], highlight: ['svc:orders:list', 'note:calls'] },
    { title: 'V3b · the same figure, right panel',
      svc: E2, slane: [E1, E2], noHeader: true, widths: [440, 314], highlight: ['svc:orders:list', 'note:calls'] },
    { title: 'V4 · below a Deployment group (rows above: a c4 rule between them)',
      svc: VDEP, slane: [VDEP], noHeader: true, widths: [560, 314], highlight: [] },
    { title: 'V5 · a header that doesn’t fit one line: the address on a second line (lane-wide svcWrap)',
      svc: VLONG, slane: [VLONG], noHeader: true, widths: [560, 314], highlight: ['svc:notifications'] },
    { title: 'C1 · narrow STATUS_INLINE chips keep the service name (Ch 06 P-08)',
      note: 'Lane step S2 at 560, 360 and a 360px phone’s 314px plate. Order of tries on a one-line chip: “catalog v63 ■ READY”; then the lamp gives way (“catalog v62 READY”, the word keeps its colour); then the version (“catalog □ NOT READY”, then “catalog NOT READY”); only where even that misses, “v63 □ NOT READY” as before. Measured as drawn: the label in the chip’s letter-spacing, the word in its own.',
      svc: V2, slane: VLANE, widths: [560, 360, 314], highlight: ['p:n1'] },
    { title: 'C2 · the same in the pool-03 sample (Ch 06’s lane R2 and R3) at 314px',
      roll: R2, rlane: RLANE, widths: [314], highlight: [] },
    { title: 'C2b · R3 (a STOPPED chip) at 314px',
      roll: R3, rlane: RLANE, widths: [314], highlight: [] }
  );

  var host = document.getElementById('cases');
  CASES.forEach(function (c) {
    if (c.group) { var g = document.createElement('h1'); g.style.marginTop = 'var(--sp-8)'; g.textContent = c.group; host.appendChild(g); return; }
    var h = document.createElement('h2'); h.textContent = c.title; host.appendChild(h);
    if (c.note) { var p = document.createElement('p'); p.innerHTML = c.note; host.appendChild(p); }
    var row = document.createElement('div'); row.className = 'row'; host.appendChild(row);
    (c.widths || [560, 360]).forEach(function (w, wi) {
      var fig = document.createElement('div'); fig.className = 'fig'; fig.style.width = w + 'px';
      var cap = document.createElement('p');
      cap.textContent = w + 'px' + (w === 314 ? ' (360px phone)' : '') + (c.perState ? (c.perState[wi] ? ' · per state' : ' · lane-wide') : '');
      fig.appendChild(cap);
      var target = document.createElement('div'); fig.appendChild(target); row.appendChild(fig);
      if (c.svc) {
        var sh = c.noHeader ? null : { lane: 'Thursday, 10:15', n: c.slane.indexOf(c.svc) + 1, total: c.slane.length };
        var sl = SVC_R.laneLayout(w, c.slane, sh);
        var sres = SVC_R.measureReserve(target, c.slane, { width: w, layout: sl, header: sh });
        SVC_R.renderCluster(target, c.svc, { width: w, layout: sl, reserve: sres, header: sh, highlight: c.highlight });
      } else if (c.roll) {
        var RR = c.rolloff ? ROLL_OFF_R : ROLL_R;
        var hd = c.rlane.length > 1 ? { lane: 'Thursday, 10:15', n: c.rlane.indexOf(c.roll) + 1, total: c.rlane.length } : null;
        var rl = RR.laneLayout(w, c.rlane, hd);
        var rro = { width: w, layout: rl, header: hd };
        var rres = RR.measureReserve(target, c.rlane, rro);
        RR.renderCluster(target, c.roll, { width: w, layout: rl, reserve: rres, header: hd, highlight: c.highlight });
      } else if (c.ser) {
        SER_R.renderCluster(target, c.state, { width: w, columns: 2, unit: w < 440 ? 22 : 32, header: { lane: '', n: null }, highlight: c.highlight });
      } else if (c.lane) {
        var header = { lane: 'Friday, 17:45', n: LANE.indexOf(c.state) + 1, total: LANE.length };
        /* as lanes.js: an inline snapshot sized to its own state's node count (P3) */
        var lo = c.perState && c.perState[wi] ? { columns: LANE_R.nodeIds(c.state).length } : undefined;
        var layout = LANE_R.laneLayout(w, LANE, header, lo);
        var ro = { width: w, layout: layout, header: header };
        if (lo) ro.columns = lo.columns;
        var reserve = LANE_R.measureReserve(target, LANE, ro);
        LANE_R.renderCluster(target, c.state, { width: w, layout: layout, reserve: reserve, header: header, highlight: c.highlight });
      } else if (c.sand === 2) {
        SHORT_R.renderCluster(target, SHORTSTATE, { width: w, nodesOnly: true, columns: 4, unit: w < 440 ? 22 : 28, highlight: c.highlight });
      } else {
        var o = { width: w, nodesOnly: true, columns: 4, labels: c.labels, highlight: c.highlight };
        if (c.header) { SAND.STRINGS.widget = 'W-02 · Ari’s sizing sheet'; SAND.STRINGS.widgetShort = 'W-02'; o.header = c.header; }
        SAND_R.renderCluster(target, c.state, o);
      }
    });
  });
})();
</script>
